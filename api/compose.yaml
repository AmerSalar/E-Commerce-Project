services:
    laravel.test:
        build:
            context: .
            dockerfile: Dockerfile
        command: tail -f /dev/null
        ports:
            - "${APP_PORT:-80}:80"
        environment:
            LARAVEL_SAIL: 0
        volumes:
            - ".:/var/www/html"
        networks:
            - app
        depends_on:
            mysql:
                condition: service_healthy
        tty: true

    mysql:
        image: "mysql:8.4"
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - "mysql-data:/var/lib/mysql"
        networks:
            - app
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            retries: 3
            timeout: 5s

networks:
    app:
        driver: bridge

volumes:
    mysql-data:
        driver: local
